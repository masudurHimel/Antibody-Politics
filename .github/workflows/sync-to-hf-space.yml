name: Sync to Hugging Face Space

on:
  push:
    branches: [master]
  workflow_dispatch:

# Only allow one sync run at a time; cancel any in-flight run when a new one starts.
concurrency:
  group: hf-space-sync
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Build deploy tree (strip non-runtime files)
        run: |
          set -euo pipefail
          # Drop paths that aren't needed on the Space and/or contain binaries
          # HF rejects without Xet/LFS. Keep this list in sync with .dockerignore.
          rm -rf sources docs scripts venv backend/venv frontend/node_modules frontend/dist .git

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USER:  ${{ vars.HF_USER }}
          HF_SPACE: antibody-politics
        run: |
          set -euo pipefail
          if [ -z "${HF_TOKEN:-}" ]; then
            echo "HF_TOKEN secret is missing" >&2
            exit 1
          fi
          if [ -z "${HF_USER:-}" ]; then
            echo "HF_USER repo variable is missing" >&2
            exit 1
          fi

          git init -b main
          git config user.email "actions@github.com"
          git config user.name  "github-actions"
          git add -A
          git commit -m "Deploy from GitHub ${GITHUB_SHA::7}"

          # Authorization sent as a header so the token never appears in the URL or logs.
          AUTH=$(printf 'x-access-token:%s' "$HF_TOKEN" | base64 -w0)
          git -c http.extraheader="Authorization: Basic ${AUTH}" \
              push --force \
              "https://huggingface.co/spaces/${HF_USER}/${HF_SPACE}" \
              main:main